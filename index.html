<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWEAR JAR</title>
<style>
  :root{ --ink:#f2f2f2; --gold:#ffd23f; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;
    font-family:'Courier New',ui-monospace,monospace;-webkit-font-smoothing:antialiased}
  body{display:flex;align-items:center;justify-content:center}

  /* ============ INTRO: the jar powers up ============ */
  #intro{position:fixed;inset:0;background:#000;z-index:10;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    animation:introOut .8s ease 2s forwards}
  @keyframes introOut{to{opacity:0;visibility:hidden}}
  #intro img{width:clamp(80px,16vh,140px);height:auto;
    filter:drop-shadow(0 0 22px rgba(255,210,63,.45)) drop-shadow(0 0 70px rgba(79,216,238,.2));
    animation:powerup 2s linear both}
  /* soft neon power-on: gentle stutters, settles */
  @keyframes powerup{
    0%{opacity:0;transform:scale(.96)}
    8%{opacity:.55} 13%{opacity:.2} 18%{opacity:.75}
    23%{opacity:.45} 29%{opacity:.9} 35%{opacity:.7}
    42%,100%{opacity:1;transform:scale(1)}
  }

  /* ============ LANDING: wordmark + email ============ */
  #stage{text-align:center;padding:0 20px;width:100%;
    opacity:0;animation:fadein .8s ease 2s forwards}
  @keyframes fadein{to{opacity:1}}

  #wordmark{display:inline-block;width:clamp(280px,62vw,620px);height:auto;margin-top:26px;
    filter:drop-shadow(0 0 12px rgba(255,255,255,.15));
    opacity:0;transform:translateY(18px);
    animation:rise 1s cubic-bezier(.2,.9,.3,1.1) 2.2s forwards;
    transition:filter .3s}
  @keyframes rise{to{opacity:1;transform:none}}
  #wordmark:hover{filter:drop-shadow(0 0 22px rgba(255,210,63,.5))}

  #tag{margin-top:30px;
    font-size:clamp(11px,1.3vw,14px);letter-spacing:.32em;text-transform:uppercase;
    background:linear-gradient(110deg,
      rgba(242,242,242,.55) 38%, #ffffff 47%, var(--gold) 50%, #ffffff 53%,
      rgba(242,242,242,.55) 62%);
    background-size:280% 100%;background-position:120% 0;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;animation:shine 1.8s ease 2.9s forwards}
  @keyframes shine{
    0%{opacity:0;background-position:120% 0}
    25%{opacity:1}
    100%{opacity:1;background-position:-30% 0}
  }

  #email{display:inline-block;margin-top:40px;color:var(--ink);text-decoration:none;
    font-size:clamp(14px,1.8vw,19px);letter-spacing:.16em;
    border-bottom:1px solid rgba(255,255,255,.35);padding-bottom:5px;
    opacity:0;animation:fadein 1s ease 2.7s forwards;transition:.3s}
  #email:hover{color:var(--gold);border-color:var(--gold);
    text-shadow:0 0 14px rgba(255,210,63,.8)}

  #book{margin-top:34px;display:inline-block;color:var(--ink);text-decoration:none;
    font-size:clamp(11px,1.3vw,13px);letter-spacing:.3em;text-transform:uppercase;
    border:1px solid rgba(255,210,63,.5);padding:11px 26px;
    opacity:0;animation:fadein 1s ease 3.3s forwards;transition:.3s}
  #book:hover{color:var(--gold);border-color:var(--gold);
    box-shadow:0 0 22px rgba(255,210,63,.35);text-shadow:0 0 12px rgba(255,210,63,.7)}
</style>
</head>
<body>

<div id="intro" title="skip">
  <img src="logo.png" alt="Swear Jar logo" width="360" height="626">
</div>

<div id="stage">
  <img id="wordmark" src="wordmark.png" alt="SWEAR JAR" width="1100" height="193">
  <div id="tag">Swear to fill jars. Sworn to fill venues.</div>
  <br>
  <a id="book" href="book.html">Book the show</a>
  <br>
  <a id="email" href="mailto:hello@swearjar.com">hello@swearjar.com</a>
</div>

<script>
/* tap the intro to skip straight to the landing */
document.getElementById('intro').addEventListener('click', function(){
  this.style.animation = 'none';
  this.style.opacity = '0';
  this.style.visibility = 'hidden';
  document.getElementById('stage').style.animation = 'none';
  document.getElementById('stage').style.opacity = '1';
  document.getElementById('wordmark').style.animation = 'none';
  document.getElementById('wordmark').style.opacity = '1';
  document.getElementById('wordmark').style.transform = 'none';
  document.getElementById('email').style.animation = 'none';
  document.getElementById('email').style.opacity = '1';
});
</script>

</body>
</html>
