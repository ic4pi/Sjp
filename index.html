<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWEAR JAR</title>
<style>
  :root{ --ink:#f2f2f2; --cyan:#4fd8ee; --gold:#ffd23f; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;
    font-family:'Courier New',ui-monospace,monospace;-webkit-font-smoothing:antialiased}
  body{display:flex;align-items:center;justify-content:center}

  /* ---------- line-art doodle field ---------- */
  #field{position:fixed;inset:0;z-index:0;pointer-events:none}
  .doodle{position:absolute;opacity:0;animation:fadein 1.4s ease forwards}
  .doodle svg{display:block;overflow:visible}
  .doodle .draw{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:100;stroke-dashoffset:100;animation:draw 2.4s ease forwards}
  .doodle .accent{stroke:var(--cyan)}
  .doodle.float{animation:fadein 1.4s ease forwards, drift var(--dur,9s) ease-in-out var(--del,2.4s) infinite alternate}
  @keyframes fadein{to{opacity:.85}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes drift{
    0%{transform:translate(0,0) rotate(0deg)}
    50%{transform:translate(var(--dx,8px),var(--dy,-10px)) rotate(var(--rot,3deg))}
    100%{transform:translate(calc(var(--dx,8px)*-1),var(--dy,-10px)) rotate(calc(var(--rot,3deg)*-1))}
  }
  .spark{position:absolute;width:3px;height:3px;border-radius:50%;
    background:var(--cyan);opacity:0;animation:rise var(--t,7s) linear infinite}
  .spark.gold{background:var(--gold)}
  @keyframes rise{
    0%{opacity:0;transform:translateY(0) scale(.6)}
    15%{opacity:.9}
    100%{opacity:0;transform:translateY(-90vh) scale(1.1)}
  }

  /* ---------- center stage ---------- */
  #stage{position:relative;z-index:2;text-align:center;padding:0 20px;
    opacity:0;animation:fadein 1.2s ease .3s forwards}

  #jar-wrap{position:relative;display:inline-block}
  #jar{display:block;width:clamp(140px,26vh,240px);height:auto;
    filter:drop-shadow(0 0 24px rgba(255,210,63,.5)) drop-shadow(0 0 70px rgba(79,216,238,.28));
    animation:levitate 5.5s ease-in-out infinite, arrive 1.6s cubic-bezier(.2,.9,.3,1.1) both}
  @keyframes arrive{from{opacity:0;transform:translateY(40px) scale(.85)}to{opacity:1;transform:none}}
  @keyframes levitate{
    0%,100%{transform:translateY(0) rotate(-1.2deg)}
    50%{transform:translateY(-14px) rotate(1.2deg)}
  }
  /* orbiting sparkles — small dots, NOT giant eggs */
  .orbit{position:absolute;left:50%;top:50%;width:0;height:0;z-index:-1;
    animation:spin var(--st,9s) linear infinite}
  .orbit i{position:absolute;width:4px;height:4px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 10px 2px rgba(255,210,63,.8);
    left:var(--ox,80px);top:var(--oy,0)}
  .orbit.c i{background:var(--cyan);box-shadow:0 0 10px 2px rgba(79,216,238,.8)}
  @keyframes spin{to{transform:rotate(360deg)}}

  #wordmark{display:block;width:clamp(260px,58vw,540px);height:auto;margin:22px auto 0;
    filter:drop-shadow(0 0 14px rgba(255,255,255,.2));
    animation:arrive 1.4s .5s cubic-bezier(.2,.9,.3,1.1) both;
    transition:filter .3s}
  #wordmark:hover{filter:drop-shadow(0 0 24px rgba(255,210,63,.55))}

  #email{display:inline-block;margin-top:44px;color:var(--ink);text-decoration:none;
    font-size:clamp(14px,1.8vw,19px);letter-spacing:.16em;
    border-bottom:1px solid rgba(255,255,255,.35);padding-bottom:5px;
    opacity:0;animation:fadein 1.4s ease 1.6s forwards;transition:.3s}
  #email:hover{color:var(--gold);border-color:var(--gold);
    text-shadow:0 0 14px rgba(255,210,63,.8)}
</style>
</head>
<body>

<div id="field"></div>

<div id="stage">
  <div id="jar-wrap">
    <div class="orbit"   style="--st:8s"><i style="--ox:88px"></i></div>
    <div class="orbit c" style="--st:12s;animation-direction:reverse"><i style="--ox:-70px;--oy:30px"></i></div>
    <div class="orbit"   style="--st:15s"><i style="--ox:64px;--oy:-46px"></i></div>
    <img id="jar" src="logo.jpg" alt="Swear Jar logo" width="402" height="700">
  </div>
  <img id="wordmark" src="wordmark.jpg" alt="SWEAR JAR" width="1400" height="246">
  <br>
  <a id="email" href="mailto:hello@swearjar.com">hello@swearjar.com</a>
</div>

<script>
const ICONS = [
  `<svg width="54" height="86" viewBox="0 0 54 86"><path class="draw" d="M27 6 a10 14 0 0 1 10 14 v14 a10 14 0 0 1 -20 0 v-14 a10 14 0 0 1 10 -14 z M17 34 h20 M27 48 v14 M15 70 h24 M27 62 v16 M19 62 l-4 8 M35 62 l4 8"/><path class="draw accent" d="M10 22 q-5 3 -6 8 M44 22 q5 3 6 8"/></svg>`,
  `<svg width="80" height="64" viewBox="0 0 80 64"><path class="draw" d="M30 8 q-14 0 -16 12 q-10 4 -6 14 q-4 10 8 14 q2 10 16 8 q6 8 14 2 q10 4 14 -6 q12 -2 10 -14 q8 -8 -2 -16 q0 -12 -14 -12 q-4 -6 -10 -2 q-6 -6 -12 0 z M40 12 v40 M28 20 q8 2 8 8 M52 20 q-8 2 -8 8 M26 42 q8 -2 10 4 M54 42 q-8 -2 -10 4"/></svg>`,
  `<svg width="46" height="46" viewBox="0 0 46 46"><path class="draw" d="M23 4 L28 17 L42 18 L31 27 L35 41 L23 33 L11 41 L15 27 L4 18 L18 17 Z"/></svg>`,
  `<svg width="40" height="64" viewBox="0 0 40 64"><path class="draw accent" d="M26 4 L8 36 L19 36 L13 60 L34 26 L23 26 Z"/></svg>`,
  `<svg width="86" height="64" viewBox="0 0 86 64"><path class="draw" d="M8 8 h54 a8 8 0 0 1 8 8 v22 a8 8 0 0 1 -8 8 h-30 l-12 10 v-10 h-12 a8 8 0 0 1 -8 -8 v-22 a8 8 0 0 1 8 -8 z M20 24 v14 M28 24 v14 M20 30 h8 M44 24 v14 M52 24 v14 M44 30 h8"/></svg>`,
  `<svg width="42" height="72" viewBox="0 0 42 72"><path class="draw accent" d="M12 6 L32 6 L26 32 L34 66 L22 50 L14 66 L20 32 Z"/></svg>`,
  `<svg width="70" height="72" viewBox="0 0 70 72"><path class="draw" d="M10 10 q18 -6 24 6 q-2 20 -12 26 q-10 -4 -12 -32 z M46 10 q-8 26 2 40 q4 12 16 8 q4 -2 2 -8 q-10 2 -12 -8 q-8 -14 -8 -32 z M17 20 q3 -2 6 0 M27 20 q3 -2 6 0 M18 30 q6 5 12 0"/></svg>`,
  `<svg width="66" height="86" viewBox="0 0 66 86"><path class="draw" d="M12 40 h42 M18 40 l-6 34 M48 40 l6 34 M14 62 h38 M26 40 v-10 M40 40 v-10 M33 14 q-6 0 -6 6 v8 h12 v-8 q0 -6 -6 -6 z M29 20 h8"/></svg>`,
  `<svg width="86" height="56" viewBox="0 0 86 56"><path class="draw" d="M10 40 q-2 -16 6 -22 q2 -8 10 -8 q6 0 8 6 l2 8 q14 2 24 8 q10 4 14 8 l4 4 q2 6 -4 6 h-58 q-4 0 -6 -4 z M18 24 l10 -4 M20 32 l12 -4"/><circle class="draw accent" cx="30" cy="16" r="2.5"/></svg>`,
  `<svg width="58" height="72" viewBox="0 0 58 72"><path class="draw" d="M12 6 h36 v60 h-36 z M12 6 q-6 0 -6 6 v48 q0 6 6 6 M20 18 h20 M20 28 h20 M20 38 h14"/></svg>`,
  `<svg width="44" height="72" viewBox="0 0 44 72"><path class="draw" d="M18 66 v-30 q0 -8 4 -8 q4 0 4 8 v12 M26 48 v-22 q0 -6 4 -6 q4 0 4 6 v22 M34 48 v-16 q0 -5 4 -5 q4 0 4 5 v18 q0 18 -14 18 q-12 0 -14 -12 l-2 -14 q-1 -7 4 -7 q5 0 5 6 z"/></svg>`,
  `<svg width="70" height="70" viewBox="0 0 70 70"><path class="draw accent" d="M35 8 v10 M35 52 v10 M8 35 h10 M52 35 h10 M16 16 l7 7 M47 47 l7 7 M54 16 l-7 7 M23 47 l-7 7"/><circle class="draw" cx="35" cy="35" r="9"/></svg>`,
  `<svg width="120" height="50" viewBox="0 0 120 50"><path class="draw" d="M8 36 q10 -26 18 -2 M30 34 l10 -18 l2 18 M46 32 q6 -20 12 -4 q4 10 -4 10 q-6 0 -8 -6 M64 30 q8 -18 14 -2 q3 8 -4 8 M86 28 l8 -14 l4 16 M102 22 q10 -8 10 2 q0 8 -8 6"/></svg>`,
  `<svg width="70" height="40" viewBox="0 0 70 40"><path class="draw" d="M4 20 q31 -22 62 0 q-31 22 -62 0 z"/><circle class="draw accent" cx="35" cy="20" r="8"/></svg>`
];

function scatter(){
  const field = document.getElementById('field');
  field.innerHTML='';
  const w = innerWidth, h = innerHeight;
  const cx = w/2, cy = h/2;
  const n = Math.min(ICONS.length, Math.max(8, Math.floor(w*h/90000)));
  [...ICONS].sort(()=>Math.random()-.5).slice(0,n).forEach(svg=>{
    const d = document.createElement('div');
    d.className = 'doodle float';
    d.innerHTML = svg;
    let x,y,tries=0;
    do{
      x = Math.random()*(w-120)+20;
      y = Math.random()*(h-140)+20;
      tries++;
    }while(Math.hypot(x+40-cx, y+40-cy) < Math.min(w,h)*0.34 && tries<20);
    d.style.left = x+'px'; d.style.top = y+'px';
    d.style.setProperty('--dur',(7+Math.random()*5)+'s');
    d.style.setProperty('--del',(1.5+Math.random()*2)+'s');
    d.style.setProperty('--dx',(Math.random()*16-8)+'px');
    d.style.setProperty('--dy',(Math.random()*-14-4)+'px');
    d.style.setProperty('--rot',(Math.random()*5-2.5)+'deg');
    d.style.animationDelay = (Math.random()*1.4)+'s';
    field.appendChild(d);
  });
  for(let i=0;i<26;i++){
    const s = document.createElement('div');
    s.className = 'spark' + (Math.random()<.3 ? ' gold' : '');
    s.style.left = Math.random()*100+'vw';
    s.style.top = (55+Math.random()*45)+'vh';
    s.style.setProperty('--t',(5+Math.random()*6)+'s');
    s.style.animationDelay = (Math.random()*6)+'s';
    field.appendChild(s);
  }
}
addEventListener('resize', scatter);
scatter();
</script>
</body>
</html>
