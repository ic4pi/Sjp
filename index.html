<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWEAR JAR</title>
<style>
  :root{ --ink:#f2f2f2; --cyan:#4fd8ee; --gold:#ffd23f; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;
    font-family:'Courier New',ui-monospace,monospace;-webkit-font-smoothing:antialiased}
  body{display:flex;align-items:center;justify-content:center}

  #stage{text-align:center;padding:0 20px;
    opacity:0;animation:fadein 1.2s ease .2s forwards}
  @keyframes fadein{to{opacity:1}}

  /* the jar — levitating, glowing */
  #jar-wrap{position:relative;display:inline-block}
  #jar{display:block;width:clamp(40px,7.5vh,70px);height:auto;
    filter:drop-shadow(0 0 26px rgba(255,210,63,.5)) drop-shadow(0 0 80px rgba(79,216,238,.22));
    animation:levitate 11s ease-in-out infinite, arrive 1.6s cubic-bezier(.2,.9,.3,1.1) both,
              flick 7s linear 2.2s infinite}
  @keyframes arrive{from{opacity:0;transform:translateY(40px) scale(.85)}to{opacity:1;transform:none}}
  @keyframes levitate{
    0%,100%{transform:translateY(0) rotate(-1deg)}
    50%{transform:translateY(-10px) rotate(1deg)}
  }
  /* neon sign flicker — mostly on, occasional stutters */
  @keyframes flick{
    0%,100%{opacity:1}
    3%{opacity:.5} 4%{opacity:1}
    38%{opacity:1} 39%{opacity:.35} 40%{opacity:.9} 41%{opacity:1}
    64%{opacity:1} 65%{opacity:.6} 66%{opacity:1}
    82%{opacity:1} 83%{opacity:.45} 84%{opacity:1}
  }
  .orbit{position:absolute;left:50%;top:50%;width:0;height:0;z-index:-1;
    animation:spin var(--st,9s) linear infinite}
  .orbit i{position:absolute;width:4px;height:4px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 10px 2px rgba(255,210,63,.8);
    left:var(--ox,80px);top:var(--oy,0)}
  .orbit.c i{background:var(--cyan);box-shadow:0 0 10px 2px rgba(79,216,238,.8)}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* the wordmark */
  #wordmark{display:block;width:clamp(280px,62vw,620px);height:auto;margin:30px auto 0;
    filter:drop-shadow(0 0 12px rgba(255,255,255,.15));
    animation:arrive 1.4s .5s cubic-bezier(.2,.9,.3,1.1) both;
    transition:filter .3s}
  #wordmark:hover{filter:drop-shadow(0 0 22px rgba(255,210,63,.5))}

  #email{display:inline-block;margin-top:48px;color:var(--ink);text-decoration:none;
    font-size:clamp(14px,1.8vw,19px);letter-spacing:.16em;
    border-bottom:1px solid rgba(255,255,255,.35);padding-bottom:5px;
    opacity:0;animation:fadein 1.4s ease 1.4s forwards;transition:.3s}
  #email:hover{color:var(--gold);border-color:var(--gold);
    text-shadow:0 0 14px rgba(255,210,63,.8)}
</style>
</head>
<body>

<div id="stage">
  <div id="jar-wrap">
    <div class="orbit"   style="--st:8s"><i style="--ox:28px"></i></div>
    <div class="orbit c" style="--st:12s;animation-direction:reverse"><i style="--ox:-22px;--oy:10px"></i></div>
    <div class="orbit"   style="--st:15s"><i style="--ox:20px;--oy:-15px"></i></div>
    <img id="jar" src="logo.png" alt="Swear Jar logo" width="360" height="626">
  </div>
  <img id="wordmark" src="wordmark.png" alt="SWEAR JAR" width="1100" height="193">
  <br>
  <a id="email" href="mailto:hello@swearjar.com">hello@swearjar.com</a>
</div>

</body>
</html>
