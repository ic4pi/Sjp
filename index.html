<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWEAR JAR</title>
<style>
  :root{ --ink:#f2f2f2; --gold:#ffd23f; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;
    font-family:'Courier New',ui-monospace,monospace;-webkit-font-smoothing:antialiased}
  body{display:flex;align-items:center;justify-content:center}

  /* ============ INTRO: the jar powers up ============ */
  #intro{position:fixed;inset:0;background:#000;z-index:10;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    animation:introOut .9s ease 2.9s forwards}
  @keyframes introOut{to{opacity:0;visibility:hidden}}
  #intro img{width:clamp(120px,28vh,220px);height:auto;
    filter:drop-shadow(0 0 30px rgba(255,210,63,.55)) drop-shadow(0 0 90px rgba(79,216,238,.25));
    animation:powerup 2.9s linear both}
  /* neon power-on: sputters, surges, steadies */
  @keyframes powerup{
    0%{opacity:0}
    4%{opacity:.7} 7%{opacity:.1} 10%{opacity:.9} 13%{opacity:.2}
    18%{opacity:1} 22%{opacity:.35} 26%{opacity:1}
    34%{opacity:.5} 38%{opacity:1}
    55%{opacity:1;transform:scale(1)}
    70%{opacity:1;transform:scale(1.04)}
    100%{opacity:1;transform:scale(1.08)}
  }

  /* ============ LANDING: wordmark + email ============ */
  #stage{text-align:center;padding:0 20px;
    opacity:0;animation:fadein 1s ease 2.9s forwards}
  @keyframes fadein{to{opacity:1}}

  #wordmark{display:block;width:clamp(280px,62vw,620px);height:auto;
    filter:drop-shadow(0 0 12px rgba(255,255,255,.15));
    opacity:0;transform:translateY(18px);
    animation:rise 1.1s cubic-bezier(.2,.9,.3,1.1) 3.1s forwards;
    transition:filter .3s}
  @keyframes rise{to{opacity:1;transform:none}}
  #wordmark:hover{filter:drop-shadow(0 0 22px rgba(255,210,63,.5))}

  #email{display:inline-block;margin-top:48px;color:var(--ink);text-decoration:none;
    font-size:clamp(14px,1.8vw,19px);letter-spacing:.16em;
    border-bottom:1px solid rgba(255,255,255,.35);padding-bottom:5px;
    opacity:0;animation:fadein 1.2s ease 3.7s forwards;transition:.3s}
  #email:hover{color:var(--gold);border-color:var(--gold);
    text-shadow:0 0 14px rgba(255,210,63,.8)}
</style>
</head>
<body>

<div id="intro" title="skip">
  <img src="logo.png" alt="Swear Jar logo" width="360" height="626">
</div>

<div id="stage">
  <img id="wordmark" src="wordmark.png" alt="SWEAR JAR" width="1100" height="193">
  <br>
  <a id="email" href="mailto:hello@swearjar.com">hello@swearjar.com</a>
</div>

<script>
/* tap the intro to skip straight to the landing */
document.getElementById('intro').addEventListener('click', function(){
  this.style.animation = 'none';
  this.style.opacity = '0';
  this.style.visibility = 'hidden';
  document.getElementById('stage').style.animation = 'none';
  document.getElementById('stage').style.opacity = '1';
  document.getElementById('wordmark').style.animation = 'none';
  document.getElementById('wordmark').style.opacity = '1';
  document.getElementById('wordmark').style.transform = 'none';
  document.getElementById('email').style.animation = 'none';
  document.getElementById('email').style.opacity = '1';
});
</script>

</body>
</html>
